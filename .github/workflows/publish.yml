name: Publish to npm

# Fires when you publish a GitHub Release (create a tag + release through
# the GitHub UI or `gh release create`). Needs an NPM_TOKEN repo secret
# (Settings -> Secrets and variables -> Actions -> New repository secret)
# with publish rights to the @productf npm org/scope — added by a human,
# never by this workflow or by an agent.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
